<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Architecture diagram for Virtual Reading World">
  <rect width="860" height="360" fill="#f8fbff"/>

  <rect x="20" y="44" width="220" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Reader Client</text>
  <text x="130" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Browser or mobile page</text>

  <rect x="280" y="44" width="180" height="92" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="370" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Frontend UI</text>
  <text x="370" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">React + Vite</text>

  <rect x="520" y="44" width="180" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="610" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Backend API</text>
  <text x="610" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Node.js + Express</text>

  <rect x="740" y="44" width="90" height="92" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">DB</text>
  <text x="785" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Postgres</text>
  <text x="785" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">server-side</text>

  <rect x="280" y="220" width="220" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Nginx Reverse Proxy</text>
  <text x="390" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">/world + /api</text>

  <rect x="110" y="180" width="420" height="24" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Client / Server boundary</text>

  <line x1="240" y1="90" x2="280" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="90" x2="520" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="90" x2="740" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="220" x2="280" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="220" x2="390" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="220" x2="560" y2="136" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="136" x2="300" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="120" y="330" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#475569">Browser/mobile reader talks to the server-side backend API; backend and DB are currently local/dev and will move to GCP later</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
