<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Production architecture diagram for Virtual Reading World">
  <rect width="860" height="360" fill="#f8fbff"/>

  <rect x="40" y="70" width="180" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Reader Client</text>
  <text x="130" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Browser / mobile</text>

  <rect x="280" y="70" width="220" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="390" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Nginx Reverse Proxy</text>
  <text x="390" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">/world + /api</text>

  <rect x="560" y="70" width="180" height="90" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="650" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Frontend UI</text>
  <text x="650" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">Static React build</text>

  <rect x="560" y="220" width="180" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">Backend API</text>
  <text x="650" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">GCP-hosted later</text>

  <rect x="760" y="220" width="80" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="800" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#111827">DB</text>
  <text x="800" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#374151">PG</text>

  <line x1="220" y1="115" x2="280" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="115" x2="560" y2="115" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="160" x2="650" y2="220" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="260" x2="760" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M390 160 L390 240 L560 240" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="60" y="320" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#475569">Production view: browser talks to the proxy; proxy serves the frontend and routes API calls to the backend</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
